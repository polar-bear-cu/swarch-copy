root = "."
tmp_dir = "tmp"

[build]
  cmd = "swag init -g cmd/main.go -o docs --outputTypes json && go build -o ./tmp/main ./cmd"
  entrypoint = ["./tmp/main"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "docs"]
  delay = 1000
  poll = true
  poll_interval = 500

[log]
  time = false

[misc]
  clean_on_exit = true
